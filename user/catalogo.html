<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookTrade</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 0.5rem">
        <svg
          style="width: 2rem; height: 2rem; color: #2563eb"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          ></path>
        </svg>
        <h1 style="margin: 0; font-size: 1.5rem">BookTrade</h1>
      </div>
      <nav>
        <a href="#">Catálogo</a>
        <a href="#">Meus Livros</a>
        <a href="#">Trocas</a>
      </nav>
    </header>

    <main>
      <h2>Catálogo de Livros</h2>

      <div style="margin-bottom: 1rem; display: flex; gap: 1rem">
        <input
          id="searchInput"
          type="text"
          placeholder="Buscar por título ou autor..."
          style="flex: 1"
        />
        <select id="genreSelect" style="width: 200px">
          <option value="all">Todos os gêneros</option>
          <!-- opções adicionadas via JS -->
        </select>
      </div>

      <div id="bookList" class="book-list">
        <!-- livros renderizados aqui -->
      </div>

      <div id="noResults" class="no-results" style="display: none">
        Nenhum livro encontrado com os filtros selecionados.
      </div>
    </main>

    <script src="catalogo.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Livros - BookTrade</title>
    <link rel="stylesheet" href="meus-livros-styles.css" />
    <script src="meus-livros-script.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container">
        <div class="header-content">
          <div class="logo">
            <svg
              class="icon-book"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              ></path>
            </svg>
            <h1>BookTrade</h1>
          </div>
          <nav class="desktop-nav">
            <a href="index.html">Catálogo</a>
            <a href="meus-livros.html" class="active">Meus Livros</a>
            <a href="cadastro-livro.html" class="btn-add-book">
              <svg
                class="icon"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 4v16m8-8H4"
                ></path>
              </svg>
              Cadastrar Livro
            </a>
            <button id="btnLogout" class="btn-logout">Sair</button>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container">
      <div class="page-header">
        <h2>Meus Livros</h2>
        <p class="subtitle" id="bookCount">Carregando...</p>
      </div>

      <!-- Filtros -->
      <div class="filters-container">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="todos">Todos</button>
          <button class="filter-tab" data-filter="pendente">Pendentes</button>
          <button class="filter-tab" data-filter="aprovado">Aprovados</button>
          <button class="filter-tab" data-filter="reprovado">Reprovados</button>
        </div>
      </div>

      <!-- Lista de Livros -->
      <div id="booksList" class="books-list">
        <!-- Skeleton Loading -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Mensagem vazia -->
      <div id="emptyState" class="empty-state" style="display: none">
        <svg
          class="empty-icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          ></path>
        </svg>
        <h3>Nenhum livro cadastrado</h3>
        <p>
          Comece cadastrando seu primeiro livro para disponibilizá-lo para troca
        </p>
        <a href="cadastro-livro.html" class="btn btn-primary">
          <svg
            class="icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
          Cadastrar Livro
        </a>
      </div>
    </main>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="modalDelete" class="modal" style="display: none">
      <div class="modal-content modal-small">
        <div class="modal-header">
          <h3>Confirmar Exclusão</h3>
          <button class="btn-close" onclick="fecharModalDelete()">
            <svg
              class="icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="warning-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              ></path>
            </svg>
          </div>
          <p class="modal-text">
            Tem certeza que deseja excluir este livro? Esta ação não pode ser
            desfeita.
          </p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="fecharModalDelete()">
            Cancelar
          </button>
          <button class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
        </div>
      </div>
    </div>

    <!-- Notificação -->
    <div id="notificacao" class="notificacao" style="display: none">
      <div class="notificacao-content">
        <svg
          class="notificacao-icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span id="notificacaoTexto"></span>
      </div>
    </div>
  </body>
</html>

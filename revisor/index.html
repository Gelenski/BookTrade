<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Revisor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="barra-navegacao">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          />
        </svg>
        BookTrade
      </div>
      <ul class="links-navegacao">
        <li><a href="#" style="color: #3b82f6">Painel Revisor</a></li>
        <button id="btnLogout" class="btn-logout">Sair</button>
      </ul>
    </nav>

    <div class="container">
      <div class="cabecalho">
        <h1>Painel do Revisor</h1>
        <p style="color: #718096; font-size: 1.125rem">
          Revise e aprove os livros enviados pelos usuários
        </p>
      </div>

      <div class="estatisticas">
        <div class="cartao-estatistica">
          <h3>Pendentes</h3>
          <p id="contagemPendentes">0</p>
        </div>
        <div class="cartao-estatistica">
          <h3>Aprovados Hoje</h3>
          <p id="contagemAprovados">0</p>
        </div>
        <div class="cartao-estatistica">
          <h3>Reprovados Hoje</h3>
          <p id="contagemReprovados">0</p>
        </div>
      </div>

      <div class="filtros">
        <div class="grupo-filtros">
          <button class="botao-filtro ativo" data-filtro="todos">Todos</button>
          <button class="botao-filtro" data-filtro="pendente">Pendentes</button>
          <button class="botao-filtro" data-filtro="aprovado">Aprovados</button>
          <button class="botao-filtro" data-filtro="reprovado">
            Reprovados
          </button>
        </div>
      </div>

      <div class="lista-livros" id="listaLivros"></div>
    </div>

    <div class="modal" id="modalReprovar">
      <div class="conteudo-modal">
        <div class="cabecalho-modal">Motivo da Reprovação</div>
        <div class="corpo-modal">
          <textarea
            id="motivoReprovacao"
            placeholder="Digite o motivo da reprovação..."
          ></textarea>
        </div>
        <div class="acoes-modal">
          <button class="botao botao-detalhes" onclick="fecharModal()">
            Cancelar
          </button>
          <button class="botao botao-reprovar" onclick="confirmarReprovacao()">
            Confirmar Reprovação
          </button>
        </div>
      </div>
    </div>

    <div class="notificacao" id="notificacao">
      <span id="textoNotificacao"></span>
    </div>
    <script src="script.js"></script>
  </body>
</html>

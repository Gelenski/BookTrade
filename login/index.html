<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="barra-navegacao">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          />
        </svg>
        BookTrade
      </div>
    </nav>
    <main>
      <form id="loginForm" class="login-form">
        <h2>Login</h2>

        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" required />

        <label for="password">Senha</label>
        <input type="password" name="senha" id="password" required />

        <div class="mostrar-senha">
          <input type="checkbox" id="toggleSenha" />
          <label for="toggleSenha">Mostrar senha</label>
        </div>

        <div
          id="message"
          style="
            display: none;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
          "
        ></div>

        <button type="submit" id="button-submit">Entrar</button>

        <p>
          Não tem uma conta?
          <a href="/cadastro/">Cadastre-se aqui</a>
        </p>

        <p>
          Esqueceu sua senha ?
          <a href="/recuperar/index.html">Recuperar senha</a>
        </p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="barra-navegacao">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M21 4H3C1.9 4 1 4.9 1 6v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM3 18V6h8v12H3zm18 0h-8V6h8v12z"/>
            </svg>
            BookTrade
        </div>
    </nav>  
  <main>
    <form id="loginForm" class="login-form">
      <h2>Login</h2>

      <label for="email">E-mail</label>
      <input type="email" name="email" id="email" required />

      <label for="password">Senha</label>
      <input type="password" name="senha" id="password" required />

      <div
        id="message"
        style="display: none; margin: 10px 0; padding: 10px; border-radius: 5px"
      ></div>

      <button type="submit" id="button-submit">Entrar</button>

      <p>
        Não tem uma conta?
        <a href="/cadastro/">Cadastre-se aqui</a>
      </p>

      <p>
        Esqueceu sua senha ?
        <a href="/recuperar/index.html">Recuperar senha</a>
      </p>
    </form>
  </main>

    <script src="script.js"></script>
  </body>
</html>
